<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>慢箋寄放自助登記機</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      margin: 0; padding: 15px; background-color: #f4f6f9;
    }
    .form-card {
      max-width: 650px; margin: 0 auto; background: #fff;
      padding: 25px; border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0; color: #1a73e8; font-size: 28px;
      text-align: center; border-bottom: 2px solid #e8eaed; padding-bottom: 12px;
    }
    label {
      font-size: 18px; font-weight: bold; color: #333;
      margin-top: 18px; display: block;
    }
    input {
      width: 100%; padding: 14px; margin-top: 6px; margin-bottom: 6px;
      font-size: 22px; border: 2px solid #ccc; border-radius: 8px;
    }
    input:focus { border-color: #1a73e8; outline: none; }
    button.btn-submit {
      width: 100%; padding: 18px; font-size: 24px; font-weight: bold;
      background-color: #1a73e8; color: white; border: none;
      border-radius: 10px; cursor: pointer; margin-top: 28px;
      box-shadow: 0 4px 6px rgba(26,115,232,0.3);
    }
    button.btn-submit:active { background-color: #1557b0; }
    button.btn-submit:disabled { background-color: #8ab4f8; cursor: wait; }
    .hint { font-size: 14px; color: #666; margin-top: 4px; }
    .submit-feedback {
      display: none; margin-top: 18px; padding: 14px;
      border-radius: 8px; font-size: 18px; font-weight: bold;
      text-align: center;
    }
    .submit-feedback.success {
      display: block; color: #176534; background: #e6f4ea;
      border: 1px solid #b7dfc4;
    }
    .submit-feedback.error {
      display: block; color: #b3261e; background: #fce8e6;
      border: 1px solid #f5c2c0;
    }
  </style>
</head>
<body>
  <main class="form-card">
    <h2>慢箋寄放自助登記</h2>

    <label for="name">顧客姓名 *</label>
    <input type="text" id="name" placeholder="請用鍵盤輸入中文姓名"
           autocomplete="name" enterkeyhint="next">
    <div class="hint">請使用 Google 輸入法直接輸入中文</div>

    <label for="phone">聯絡電話 *</label>
    <input type="tel" id="phone" placeholder="請輸入聯絡電話"
           inputmode="tel" autocomplete="tel" enterkeyhint="done">

    <button class="btn-submit" id="submitButton" type="button" onclick="submitForm()">確認送出</button>
    <div id="submitFeedback" class="submit-feedback" role="status" aria-live="polite"></div>
  </main>

  <script>
    // 與電腦版共用同一支 Google Apps Script。
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1sFBPnviMWFXwo3M_UrpApXvcl4kD3aS_rlw470CvJ5dMJCUI2v3c8NPdaripiPbizA/exec';

    function showFeedback(message, type) {
      const feedback = document.getElementById('submitFeedback');
      feedback.textContent = message;
      feedback.className = 'submit-feedback ' + type;
    }

    function submitForm() {
      const nameInput = document.getElementById('name');
      const phoneInput = document.getElementById('phone');
      const button = document.getElementById('submitButton');
      const name = nameInput.value.trim();
      const phone = phoneInput.value.trim();
      const now = new Date().toLocaleString('zh-TW', { hour12: false });

      if (!name) {
        showFeedback('請先輸入顧客姓名。', 'error');
        nameInput.focus();
        return;
      }
      if (!phone) {
        showFeedback('請先輸入聯絡電話。', 'error');
        phoneInput.focus();
        return;
      }

      button.disabled = true;
      button.textContent = '送出中…';
      showFeedback('資料送出中，請稍候…', 'success');

      // date2/date3 保留為空值，維持既有 Google Sheet 欄位對應。
      // 注意：no-cors 無法讀取 Apps Script 回應內容；成功提示代表請求已完成傳送，
      // 並非伺服器端寫入結果的可驗證確認。
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({
          time: now,
          hospital: '自助機',
          name: name,
          idNum: '',
          birth: '',
          phone: phone,
          date2: '',
          date3: '',
          note: 'Kiosk'
        })
      }).then(function() {
        nameInput.value = '';
        phoneInput.value = '';
        showFeedback('送出完成！可以繼續登記下一位。', 'success');
        nameInput.focus();
      }).catch(function(err) {
        console.error('Google Script 寫入請求失敗', err);
        showFeedback('送出失敗，請檢查網路後再試一次。', 'error');
      }).finally(function() {
        button.disabled = false;
        button.textContent = '確認送出';
      });
    }

    // 在電話欄位按 Enter 時直接送出，方便連續登記。
    document.getElementById('phone').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') submitForm();
    });
  </script>
</body>
</html>
