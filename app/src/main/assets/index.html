<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>慢箋寄放自助登記機</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      margin: 0; padding: 15px; background-color: #f4f6f9;
    }

    .no-print {
      max-width: 650px; margin: 0 auto; background: #ffffff;
      padding: 25px; border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .no-print h2 {
      margin-top: 0; color: #1a73e8; font-size: 28px;
      text-align: center; border-bottom: 2px solid #e8eaed; padding-bottom: 12px;
    }
    .no-print label {
      font-size: 18px; font-weight: bold; color: #333;
      margin-top: 18px; display: block;
    }
    .no-print input {
      width: 100%; padding: 14px; margin-top: 6px; margin-bottom: 6px;
      font-size: 22px; border: 2px solid #ccc; border-radius: 8px;
    }
    .no-print input:focus { border-color: #1a73e8; outline: none; }

    .no-print button.btn-submit {
      width: 100%; padding: 18px; font-size: 24px; font-weight: bold;
      background-color: #1a73e8; color: white; border: none;
      border-radius: 10px; cursor: pointer; margin-top: 28px;
      box-shadow: 0 4px 6px rgba(26,115,232,0.3);
    }
    .no-print button.btn-submit:active { background-color: #1557b0; }

    .hint { font-size: 14px; color: #666; margin-top: 4px; }

    .print-only { display: none; }

    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      body { margin: 0; padding: 0; background: white; }
      .no-print { display: none !important; }
      .print-only { display: block !important; width: 100%; height: 270mm; box-sizing: border-box; }
      .receipt-copy { height: 125mm; padding: 10mm 8mm; box-sizing: border-box; position: relative; }
      .receipt-title { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 12px; }
      .receipt-tag {
        position: absolute; top: 10mm; right: 8mm;
        font-size: 15px; font-weight: bold; border: 1px solid #000; padding: 3px 6px;
      }
      .info-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      .info-table td { padding: 6px 4px; font-size: 15px; vertical-align: top; }
      .info-table td.label { font-weight: bold; width: 110px; white-space: nowrap; }
      .receipt-footer {
        font-size: 13px; color: #444; text-align: center;
        margin-top: 18px; border-top: 1px solid #ddd; padding-top: 8px;
      }
      .cut-line {
        height: 20mm; border-top: 2px dashed #666;
        text-align: center; line-height: 20mm; font-size: 13px; color: #666;
      }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <h2>慢箋寄放自助登記</h2>

    <label for="name">顧客姓名 *</label>
    <input type="text" id="name" placeholder="請用鍵盤輸入中文姓名" autocomplete="name" enterkeyhint="next">
    <div class="hint">請使用 Google 輸入法直接輸入中文</div>

    <label for="phone">聯絡電話 *</label>
    <input type="tel" id="phone" placeholder="請輸入聯絡電話" inputmode="tel" autocomplete="tel" enterkeyhint="next">

    <label for="date2">第二次領藥起始日</label>
    <input type="date" id="date2">

    <label for="date3">第三次領藥起始日</label>
    <input type="date" id="date3">

    <button class="btn-submit" onclick="submitAndPrint()">確認送出並列印憑證</button>
  </div>

  <!-- 列印：一式兩聯 -->
  <div class="print-only">
    <div class="receipt-copy">
      <div class="receipt-tag">顧客憑證聯</div>
      <div class="receipt-title">大樹藥局大灣店 06-2728822 - 慢箋寄放憑證</div>
      <table class="info-table">
        <tr>
          <td class="label">收案時間：</td>
          <td><span class="p-time"></span></td>
          <td class="label">顧客姓名：</td>
          <td><span class="p-name"></span></td>
        </tr>
        <tr>
          <td class="label">聯絡電話：</td>
          <td><span class="p-phone"></span></td>
          <td class="label">二次領藥區間：</td>
          <td><span class="p-date2"></span></td>
        </tr>
        <tr>
          <td class="label">三次領藥區間：</td>
          <td colspan="3"><span class="p-date3"></span></td>
        </tr>
      </table>
      <div class="receipt-footer">
        * 請妥善保管本憑證，領藥時請出示本單或受處方人身分證件 *
      </div>
    </div>

    <div class="cut-line">✂--------------------------- 請 沿 虛 線 裁 切 ---------------------------✂</div>

    <div class="receipt-copy">
      <div class="receipt-tag">藥局存根聯</div>
      <div class="receipt-title">大樹藥局大灣店 06-2728822 - 慢箋寄放存根</div>
      <table class="info-table">
        <tr>
          <td class="label">收案時間：</td>
          <td><span class="p-time"></span></td>
          <td class="label">顧客姓名：</td>
          <td><span class="p-name"></span></td>
        </tr>
        <tr>
          <td class="label">聯絡電話：</td>
          <td><span class="p-phone"></span></td>
          <td class="label">二次領藥區間：</td>
          <td><span class="p-date2"></span></td>
        </tr>
        <tr>
          <td class="label">三次領藥區間：</td>
          <td colspan="3"><span class="p-date3"></span></td>
        </tr>
      </table>
      <div class="receipt-footer" style="text-align: right; padding-right: 20px;">
        調劑藥師簽章：__________________
      </div>
    </div>
  </div>

  <script>
    // 與電腦版 讀健保卡1.7 同一支 Google Script
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1sFBPnviMWFXwo3M_UrpApXvcl4kD3aS_rlw470CvJ5dMJCUI2v3c8NPdaripiPbizA/exec';

    function formatDateRange(dateString) {
      if (!dateString) return '無';
      var startDate = new Date(dateString);
      var endDate = new Date(startDate);
      endDate.setDate(startDate.getDate() + 10);
      return (startDate.getMonth() + 1) + '/' + startDate.getDate() +
             ' ~ ' + (endDate.getMonth() + 1) + '/' + endDate.getDate();
    }

    function updateClassText(className, val) {
      document.querySelectorAll('.' + className).forEach(function(el) {
        el.innerText = val;
      });
    }

    function submitAndPrint() {
      var name = document.getElementById('name').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var rawDate2 = document.getElementById('date2').value;
      var rawDate3 = document.getElementById('date3').value;
      var now = new Date().toLocaleString('zh-TW', { hour12: false });

      if (!name) {
        alert('請輸入顧客姓名！');
        document.getElementById('name').focus();
        return;
      }
      if (!phone) {
        alert('請輸入聯絡電話！');
        document.getElementById('phone').focus();
        return;
      }

      // 領藥區間（與電腦版相同算法：起始日 + 10 天）
      var date2Range = formatDateRange(rawDate2);
      var date3Range = formatDateRange(rawDate3);

      updateClassText('p-time', now);
      updateClassText('p-name', name);
      updateClassText('p-phone', phone);
      updateClassText('p-date2', date2Range);
      updateClassText('p-date3', date3Range);

      // 對齊 Google Sheet 欄位 key（與電腦版同一支 Script）
      // 電腦版有的欄位：time, hospital, name, idNum, birth, phone, date2, date3, note
      // Kiosk 精簡版：缺的欄位填預設值，確保 Sheet 格子不會錯位
      if (GOOGLE_SCRIPT_URL) {
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            time: now,
            hospital: '自助機',
            name: name,
            idNum: '',
            birth: '',
            phone: phone,
            date2: date2Range,
            date3: date3Range,
            note: 'Kiosk'
          })
        }).catch(function(err) {
          console.error('Google Script 寫入失敗', err);
        });
      }

      window.print();
    }
  </script>
</body>
</html>
